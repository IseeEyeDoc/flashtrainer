v id="welcome" hidden><div class="wcard" role="dialog" aria-modal="true" aria-labelledby="wTitle"><div class="wlang" role="group" aria-label="Language / Idioma"><button type="button" id="wLangEn">English</button><button type="button" id="wLangEs">Español</button></div><button type="button" id="wListen" class="wlisten" aria-label="Listen / Escuchar">🔊</button><h2 id="wTitle">Welcome to Flash Trainer</h2><p id="wP1"></p><p id="wP2"></p><div class="wbtns"><button type="button" id="wTour" class="wmain"></button><button type="button" id="wGuide"></button><button type="button" id="wStart"></button></div><label class="wcheck"><input type="checkbox" id="welcomeNoShow"> <span id="wNoText"></span></label><p class="wnote" id="wNote"></p></div></div><template id="guideTpl"><h1 id="what-is-a-tachistoscope">1. What Is a Tachistoscope?</h1>
<p>A <strong>tachistoscope</strong> (pronounced ta-KISS-toe-scope) is a
device that shows a picture, a letter, or a word for a very short time,
and then hides it. The name comes from Greek words that mean "quick
view."</p>
<p>The first tachistoscope was described in 1859 by a German scientist
named A. W. Volkmann. For many years, scientists used these machines to
study how fast people see and remember things.</p>
<p>During World War II, a professor at Ohio State University named
Samuel Renshaw used flash training to teach sailors and pilots to tell
friendly airplanes from enemy airplanes in a split second. Later, many
schools used tachistoscopes to help students with reading.</p>
<p>The old machines used film or slides, shutters, and projectors.
Today, a computer screen can do the same job. <strong>Flash
Trainer</strong> is a tachistoscope that runs on your own computer.</p>
<p>We found that children in the vision clinic at the University of
Houston College of Optometry thoroughly enjoyed the tachistoscope
training station. They delighted in seeing how many random letters and
numbers they could remember in the shortest amount of time. It is very
game-like, and children love games. Many excelled at this activity and
built an excellent retention ability that improved with repeated
training.</p>
<h1 id="what-flash-trainer-is-designed-to-help-practice">2. What Flash
Trainer Is Designed to Help Practice</h1>
<p>Flash Trainer shows letters, numbers, shapes, or words for a short
time. Then the child tells you what they saw. Over time, you show more
items, for a shorter time.</p>
<p>It is designed to help children practice:</p>
<ul>
<li><p><strong>Correct order (sequencing).</strong> Seeing letters and
numbers in the right order, from left to right, the way we
read.</p></li>
<li><p><strong>Visual memory.</strong> Holding a picture of what they
saw in their mind, long enough to say it back.</p></li>
<li><p><strong>A wider view.</strong> Taking in more letters, numbers,
or a whole word in one quick look.</p></li>
<li><p><strong>Direction.</strong> Knowing left from right, up from
down, and which way letters like b, d, p, and q face.</p></li>
</ul>
<p><strong>Important:</strong> Flash Trainer is a practice tool. It is
not a test, and it does not diagnose or cure any reading problem. It
does not replace good reading lessons. Go slowly, keep it short, and
keep it fun.</p>
<h1 id="book-mode-and-advanced-mode">3. Book Mode and Advanced Mode</h1>
<p>Flash Trainer has two modes. Use the <strong>BOOK MODE</strong> and
<strong>ADVANCED MODE</strong> buttons at the top right of the display
screen to switch between them.</p>
<h2 id="book-mode-for-parents-and-teachers-using-the-book">Book Mode:
for parents and teachers using the book</h2>
<ul>
<li><p>Follows the activities in the book, step by step.</p></li>
<li><p>Four simple activities: Direction &amp; Position, Letter
Identity, Position &amp; Order, and My Practice List.</p></li>
<li><p>Four challenge levels, from Beginning to Extra
challenge.</p></li>
<li><p>Big, easy buttons. Fewer choices.</p></li>
<li><p>An adult listens to the child. There is no scoring.</p></li>
</ul>
<h2 id="advanced-mode-for-more-advanced-practice">Advanced Mode: for
more advanced practice</h2>
<ul>
<li><p>More activities: Flash &amp; Recall, Find the Flip (a backward
letter), Shape Quest, and Word Order.</p></li>
<li><p>Exact control of time (as short as about 17 thousandths of a
second), size, number of symbols, spacing, and colors.</p></li>
<li><p>Can use real words, create your own word lists, or make your own
sequence.</p></li>
<li><p>Can keep score, show a results table, and save results to a
spreadsheet file (CSV).</p></li>
<li><p>Full screen, and/or a second screen (if available) for the child
while the adult runs the controls.</p></li>
</ul>
<p><strong>Not sure which to use? Start with Book Mode.</strong></p>
<h1 id="before-you-start">4. Before You Start</h1>
<h2 id="have-the-eyes-checked-first">Have the eyes checked first</h2>
<p>Before starting, it is strongly recommended to have the child's eyes
examined by an eye doctor. If a child has trouble with these activities,
it can be a sign of a vision problem. Glasses or vision therapy may
help. A school eye chart test does not check everything that matters for
reading.</p>
<h2 id="flashing-caution">Flashing caution</h2>
<p>Flash Trainer shows letters, numbers, shapes, and words that appear
and disappear quickly. <strong>Do not use it with anyone who has had
seizures from flashing lights,</strong> unless their doctor says it is
safe. Stop right away if the child feels dizzy, gets a headache, or
feels sick.</p>
<h2 id="set-up-the-room">Set up the room</h2>
<ul>
<li><p>Sit the child about an arm's length from the screen, looking
straight at it.</p></li>
<li><p>Use a quiet room with moderate lighting and no glare on the
screen.</p></li>
<li><p>If the child wears glasses for close work, they should wear
them.</p></li>
<li><p>Keep sessions short: 5 to 10 minutes is plenty. Stop while it is
still fun.</p></li>
</ul>
<h2 id="is-the-screen-standing-up-or-lying-flat">Is the screen standing
up or lying flat?</h2>
<p>At the top of the left side is a box called <strong>Screen
position.</strong> Choose <strong>Screen: Upright</strong> if the screen
stands up like a TV. Choose <strong>Screen: Lying flat</strong> if a
tablet or laptop is lying flat on the table. This changes the direction
words in the answers to match the physical plane of the screen. For a
screen lying flat, "up" becomes "away from you" and "down" becomes
"toward you." Left and right stay the same.</p>
<h2 id="full-screen">Full screen</h2>
<p>On a Windows computer, press the <strong>F11</strong> key to fill the
whole screen. Press <strong>F11</strong> again to go back. On a Mac,
press <strong>Control + Command + F.</strong> It is highly recommended
to use this program in full screen mode.</p>
<h2 id="your-privacy">Your privacy</h2>
<p>Flash Trainer does not ask for names and does not send anything over
the internet. It works without an internet connection. Your own word
lists are saved only on this computer. In Advanced Mode, scores stay on
the screen until you save them or close the page.</p>
<h1 id="your-first-session-in-5-steps">5. Your First Session in 5
Steps</h1>
<h2 id="book-mode">Book Mode</h2>
<ol type="1">
<li><p>Click <strong>BOOK MODE.</strong> Under <strong>Choose an
activity,</strong> pick <strong>1 · Direction &amp; Position.</strong>
Under <strong>Challenge level,</strong> pick <strong>1 ·
Beginning.</strong></p></li>
<li><p>Open <strong>Presentation settings (optional)</strong> and set
<strong>Display duration</strong> to <strong>Teaching · stays
visible.</strong> This lets the child learn without any rush.</p></li>
<li><p>Click the red <strong>FLASH</strong> button. An arrow appears.
Ask the child to point the way the arrow points.</p></li>
<li><p>Click <strong>SHOW ANSWER</strong> to check together. Then click
<strong>NEXT</strong> and do another one.</p></li>
<li><p>When the child gets almost all of them right, change
<strong>Display duration</strong> to <strong>1 second.</strong> Later,
click <strong>+ Harder</strong> to move up a level. At Level 4, some
arrows point at a slant.</p></li>
</ol>
<h2 id="advanced-mode">Advanced Mode</h2>
<ol type="1">
<li><p>Click <strong>ADVANCED MODE.</strong> Set
<strong>Activity</strong> to <strong>Flash &amp; Recall</strong> and
<strong>Symbols</strong> to <strong>Numbers.</strong></p></li>
<li><p>Set <strong>Number of symbols</strong> to 3, <strong>Exposure
time</strong> to <strong>1 second,</strong> and leave <strong>Symbol
size</strong> at 72 px.</p></li>
<li><p>Click the red <strong>FLASH!</strong> button (or press the space
bar). The child says the numbers back, in order.</p></li>
<li><p>Type what the child said in <strong>Response</strong> and click
<strong>Score response,</strong> or just click <strong>Mark
correct</strong> or <strong>Mark incorrect.</strong> Scoring is
optional, but it provides a good way to monitor progress.</p></li>
<li><p>After about 8 correct out of 10, make it a little harder: one
more symbol, or a shorter time. Change only one thing at a
time.</p></li>
</ol>

<tr>

</tr>
<tr>
<td>Letter Identity presentation</td>
<td>Shows only in Letter Identity, levels 3 and 4. Random letters (the

<tr>
<td>Presentation settings (optional)</td>
<td>Click to open more settings:</td>

<tr>
<td>Symbol size</td>

<p><strong>What do the activities and levels show?</strong></p>
<table>

<thead>
<tr>
<th><strong>Activity</strong></th>
<th><strong>What it shows</strong></th>
</tr>
</thead>
<tbody>
<tr>
<td>1 · Direction &amp; Position</td>
<td>Level 1: an arrow (left, right, up, down). Level 2: a dot left or

</tr>
<tr>
<td>2 · Letter Identity</td>
<td>Level 1: one letter (b, d, p, or q). Level 2: two letters. Level 3:

<tr>
<td>3 · Position &amp; Order</td>
<td>Level 1: two numbers. Level 2: three numbers. Ask "Which was first?

them all back in order.</td>
</tr>
<tr>
<td>4 · My Practice List</td>
<td>Shows one item at a time from your own list.</td>
</tr>
</tbody>

<h1 id="tips-for-success">8. Tips for Success</h1>
<ul>
<li><p><strong>Teach first, then flash.</strong> Use Teaching mode or

<li><p><strong>Change one thing at a time.</strong> Time, size, or
number of symbols. Not all three at once.</p></li>
<li><p><strong>Praise effort.</strong> Say "Good looking!" not just
"Right!"</p></li>
<li><p><strong>Stop while it is fun.</strong> A short, happy session is
better than a long, tired one.</p></li>
<li><p><strong>Read the book.</strong> It explains why each activity

check.</p></li>

<h1 id="what-is-a-tachistoscope">1. ¿Qué es un taquistoscopio?</h1>
<p>Un <strong>taquistoscopio</strong> es un aparato que muestra un dibujo, una letra o una palabra por muy poco tiempo, y luego la esconde. El nombre viene de palabras griegas que significan "vista rápida".</p>
<p>El primer taquistoscopio fue descrito en 1859 por un científico alemán llamado A. W. Volkmann. Durante muchos años, los científicos usaron estas máquinas para estudiar qué tan rápido vemos y recordamos las cosas.</p>
<p>Durante la Segunda Guerra Mundial, un profesor de la Universidad Estatal de Ohio llamado Samuel Renshaw usó este tipo de entrenamiento para enseñar a marineros y pilotos a distinguir, en un instante, los aviones amigos de los aviones enemigos. Más tarde, muchas escuelas usaron taquistoscopios para ayudar a los estudiantes con la lectura.</p>
<p>Las máquinas antiguas usaban película o diapositivas, obturadores y proyectores. Hoy, una pantalla de computadora puede hacer el mismo trabajo. <strong>Flash Trainer</strong> es un taquistoscopio que funciona en su propia computadora.</p>
<p>En la clínica de visión de la Facultad de Optometría de la Universidad de Houston, vimos que a los niños les encantaba la estación de entrenamiento con el taquistoscopio. Disfrutaban viendo cuántas letras y números al azar podían recordar en el menor tiempo posible. Es muy parecido a un juego, y a los niños les encantan los juegos. Muchos se destacaron en esta actividad y desarrollaron una excelente capacidad de recordar, que mejoraba con la práctica.</p>
<h1 id="what-flash-trainer-is-designed-to-help-practice">2. Qué ayuda a practicar Flash Trainer</h1>
<p>Flash Trainer muestra letras, números, figuras o palabras por poco tiempo. Luego el niño le dice lo que vio. Con el tiempo, usted muestra más cosas, por menos tiempo.</p>
<p>Está diseñado para ayudar a los niños a practicar:</p>
<ul>
<li><p><strong>El orden correcto (secuencia).</strong> Ver las letras y los números en el orden correcto, de izquierda a derecha, como cuando leemos.</p></li>
<li><p><strong>La memoria visual.</strong> Guardar en la mente una imagen de lo que vieron, el tiempo suficiente para decirlo.</p></li>
<li><p><strong>Una vista más amplia.</strong> Captar más letras, más números o una palabra completa en una sola mirada rápida.</p></li>
<li><p><strong>La dirección.</strong> Saber cuál es la izquierda y cuál es la derecha, arriba y abajo, y hacia dónde miran letras como b, d, p y q.</p></li>
</ul>
<p><strong>Importante:</strong> Flash Trainer es una herramienta de práctica. No es un examen, y no diagnostica ni cura ningún problema de lectura. No reemplaza las buenas clases de lectura. Vaya despacio, haga sesiones cortas y que sea divertido.</p>
<p><strong>Las letras y palabras del entrenamiento siempre están en inglés.</strong> Pida a su niño que diga los nombres y los sonidos de las letras <strong>en inglés</strong>. Eso es lo que la escuela va a esperar.</p>
<h1 id="book-mode-and-advanced-mode">3. Modo Libro y Modo Avanzado</h1>
<p>Flash Trainer tiene dos modos. Use los botones <strong>BOOK MODE</strong> (modo libro) y <strong>ADVANCED MODE</strong> (modo avanzado), arriba a la derecha de la pantalla de imagen, para cambiar de uno a otro.</p>
<h2 id="book-mode-for-parents-and-teachers-using-the-book">Modo Libro: para padres y maestros que usan el libro</h2>
<ul>
<li><p>Sigue las actividades del libro, paso a paso.</p></li>
<li><p>Cuatro actividades sencillas: Dirección y posición, Identidad de letras, Posición y orden, y Mi lista de práctica.</p></li>
<li><p>Cuatro niveles de dificultad, desde Inicial hasta Reto extra.</p></li>
<li><p>Botones grandes y fáciles. Menos opciones.</p></li>
<li><p>Un adulto escucha al niño. No se lleva puntaje.</p></li>
</ul>
<h2 id="advanced-mode-for-more-advanced-practice">Modo Avanzado: para práctica más avanzada</h2>
<ul>
<li><p>Más actividades: Flash &amp; Recall (mostrar y recordar), Find the Flip (encontrar la letra al revés), Shape Quest (figuras) y Word Order (orden de las letras de una palabra).</p></li>
<li><p>Control exacto del tiempo (tan corto como unas 17 milésimas de segundo), del tamaño, del número de símbolos, del espacio entre ellos y de los colores.</p></li>
<li><p>Puede usar palabras reales, crear sus propias listas de palabras o escribir su propia secuencia.</p></li>
<li><p>Puede llevar puntaje, mostrar una tabla de resultados y guardar los resultados en un archivo de hoja de cálculo (CSV).</p></li>
<li><p>Pantalla completa y/o una segunda pantalla (si la tiene) para el niño, mientras el adulto maneja los controles.</p></li>
</ul>
<p><strong>¿No sabe cuál usar? Empiece con el Modo Libro.</strong></p>
<p>En el Modo Avanzado, los nombres de los controles en la pantalla están solo en inglés. La ayuda (el botón <strong>? HELP</strong>) los explica en español.</p>
<h1 id="before-you-start">4. Antes de empezar</h1>
<h2 id="have-the-eyes-checked-first">Primero, revise la vista</h2>
<p>Antes de empezar, se recomienda mucho que un doctor de los ojos le haga un examen de la vista al niño. Si un niño tiene dificultad con estas actividades, puede ser señal de un problema de la vista. Los lentes o la terapia visual pueden ayudar. La prueba de la tabla de letras de la escuela no revisa todo lo que importa para leer.</p>
<h2 id="flashing-caution">Precaución con las imágenes que parpadean</h2>
<p>Flash Trainer muestra letras, números, figuras y palabras que aparecen y desaparecen rápidamente. <strong>No lo use con nadie que haya tenido convulsiones por luces que parpadean,</strong> a menos que su doctor diga que es seguro. Pare de inmediato si el niño se siente mareado, le duele la cabeza o se siente mal.</p>
<h2 id="set-up-the-room">Prepare el cuarto</h2>
<ul>
<li><p>Siente al niño a la distancia de un brazo de la pantalla, mirándola de frente.</p></li>
<li><p>Use un cuarto tranquilo, con luz moderada y sin reflejos en la pantalla.</p></li>
<li><p>Si el niño usa lentes para ver de cerca, debe ponérselos.</p></li>
<li><p>Haga sesiones cortas: de 5 a 10 minutos es suficiente. Pare mientras todavía sea divertido.</p></li>
</ul>
<h2 id="is-the-screen-standing-up-or-lying-flat">¿La pantalla está de pie o acostada?</h2>
<p>Arriba, en el lado izquierdo, hay un cuadro llamado <strong>Screen position</strong> (posición de la pantalla). Elija <strong>Screen: Upright</strong> (vertical) si la pantalla está de pie, como un televisor. Elija <strong>Screen: Lying flat</strong> (acostada) si una tableta o computadora portátil está acostada sobre la mesa. Esto cambia las palabras de dirección en las respuestas para que coincidan con la posición de la pantalla. Con la pantalla acostada, "arriba" se convierte en "lejos de usted" y "abajo" en "hacia usted". La izquierda y la derecha no cambian.</p>
<h2 id="full-screen">Pantalla completa</h2>
<p>En una computadora con Windows, oprima la tecla <strong>F11</strong> para llenar toda la pantalla. Oprima <strong>F11</strong> otra vez para regresar. En una Mac, oprima <strong>Control + Command + F.</strong> Se recomienda mucho usar este programa en pantalla completa.</p>
<h2 id="your-privacy">Su privacidad</h2>
<p>Flash Trainer no pide nombres y no envía nada por internet. Funciona sin conexión a internet. Sus propias listas de palabras se guardan solo en esta computadora. En el Modo Avanzado, los puntajes se quedan en la pantalla hasta que usted los guarde o cierre la página.</p>

<li><p>Haga clic en el botón rojo <strong>FLASH.</strong> Aparece una flecha. Pida al niño que señale hacia donde apunta la flecha.</p></li>

<li><p>Después de unas 8 respuestas correctas de 10, hágalo un poco más difícil: un símbolo más, o menos tiempo. Cambie solo una cosa a la vez.</p></li>

<tr><td>REVIEW (repasar, café)</td><td>Muestra los mismos símbolos otra vez y los deja en la pantalla.</td></tr>

<tr><td>HIDE (esconder)</td><td>Esconde los símbolos de inmediato.</td></tr>
<tr><td>SHOW ANSWER (ver respuesta)</td><td>Muestra los símbolos otra vez con la respuesta debajo.</td></tr>
<tr><td>Practice / Hold<br>(practicar / mantener)</td><td>Muestra los símbolos y los deja en la pantalla hasta que usted haga clic en HIDE. Bueno para enseñar.</td></tr>
<tr><td>Colors (colores)</td><td>Cuatro opciones rápidas: blanco sobre negro, celeste sobre negro, amarillo sobre negro o negro sobre blanco.</td></tr>
<tr><td>Highlight reversal<br>(marcar la letra al revés)</td><td>Solo para Find the Flip. Pone un cuadro rojo alrededor de la letra al revés.</td></tr>
<tr><td>Full screen<br>(pantalla completa)</td><td>La pantalla de imagen llena todo el monitor. Oprima Esc para regresar.</td></tr>
<tr><td>Second display<br>(segunda pantalla)</td><td>Abre una segunda ventana para el monitor del niño. Arrástrela al segundo monitor y hágala de tamaño completo.</td></tr>
</tbody></table>
<p>Oprima <strong>Esc</strong> para parar un destello en cualquier momento.</p>
<h2 id="advanced-mode-scoring-on-the-right">Modo Avanzado: puntaje (a la derecha)</h2>
<table><thead><tr><th>Control</th><th>Qué hace</th></tr></thead><tbody>
<tr><td>Response (optional)<br>(respuesta)</td><td>Escriba lo que dijo el niño.</td></tr>
<tr><td>Session goal<br>(meta de la sesión)</td><td>Un recordatorio de lo que están practicando, como el tiempo más corto o el tamaño más pequeño. Se guarda con sus resultados.</td></tr>
<tr><td>Score response<br>(calificar respuesta)</td><td>Compara lo que usted escribió con la respuesta.</td></tr>
<tr><td>Mark correct / Mark incorrect<br>(correcto / incorrecto)</td><td>Califica la prueba sin escribir.</td></tr>
<tr><td>Export CSV<br>(exportar CSV)</td><td>Guarda los resultados como un archivo CSV. Excel lo puede abrir. Para guardarlo como un archivo normal de Excel, use Archivo → Guardar como en Excel.</td></tr>
<tr><td>Clear results<br>(borrar resultados)</td><td>Borra la tabla de resultados.</td></tr>
<tr><td>Session results<br>(resultados de la sesión)</td><td>Una lista de cada prueba calificada, con el porcentaje de aciertos.</td></tr>
</tbody></table>
<p>Una buena regla: cuando el niño acierta <strong>8 de 10</strong> con los mismos ajustes, es hora de hacer una cosa un poco más difícil. Esto es solo una guía. No es una norma médica.</p>
<h1 id="how-many-symbols-fit-on-the-screen">7. ¿Cuántos símbolos caben en la pantalla?</h1>
<p>En el Modo Avanzado, Flash Trainer siempre muestra los símbolos <strong>exactamente</strong> del tamaño que usted escoge. Los símbolos grandes ocupan más espacio, así que caben menos a lo ancho de la pantalla.</p>
<ul>
<li><p>Si hace los símbolos más grandes, <strong>Number of symbols</strong> (número de símbolos) puede bajar solo.</p></li>
<li><p>Si pide más símbolos, <strong>Symbol size</strong> (tamaño del símbolo) puede bajar solo.</p></li>
<li><p>La nota amarilla debajo de los controles deslizantes siempre le dice cuántos caben en <strong>su</strong> pantalla.</p></li>
</ul>
<p>Esta tabla muestra más o menos cuántos símbolos caben en una computadora portátil de 13 pulgadas, con Spacing (espacio) en 20%. Las pantallas más grandes caben más. En pantalla completa caben más.</p>
<table><thead><tr><th>Tamaño del símbolo</th><th>Ventana: letras</th><th>Ventana: números</th><th>Pantalla completa: letras</th><th>Pantalla completa: números</th></tr></thead><tbody>
<tr><td>60 px o menos</td><td>12</td><td>12</td><td>12</td><td>12</td></tr>
<tr><td>80 px</td><td>10</td><td>12</td><td>12</td><td>12</td></tr>
<tr><td>100 px</td><td>8</td><td>9</td><td>12</td><td>12</td></tr>
<tr><td>120 px</td><td>7</td><td>8</td><td>11</td><td>12</td></tr>
<tr><td>140 px</td><td>6</td><td>7</td><td>9</td><td>11</td></tr>
<tr><td>160 px</td><td>5</td><td>6</td><td>8</td><td>9</td></tr>
<tr><td>180 px</td><td>4</td><td>5</td><td>7</td><td>8</td></tr>
</tbody></table>
<p><strong>Esta tabla es solo una guía general. Su pantalla puede ser diferente.</strong> El tamaño de la pantalla y los ajustes de su computadora (como letra más grande) cambian cuántos símbolos caben. La nota amarilla en su pantalla siempre muestra el número real para su computadora.</p>
<p>La mayoría de los niños no pasan de 7 u 8 símbolos con destellos cortos, así que estos límites casi nunca importan en la práctica.</p>
<h1 id="tips-for-success">8. Consejos para tener éxito</h1>
<ul>
<li><p><strong>Primero enseñe, luego muestre rápido.</strong> Use el modo de enseñanza o Practice / Hold hasta que el niño conozca las letras.</p></li>
<li><p><strong>Cambie una cosa a la vez.</strong> El tiempo, el tamaño o el número de símbolos. No las tres a la vez.</p></li>
<li><p><strong>Elogie el esfuerzo.</strong> Diga "¡Qué bien miraste!", no solo "¡Correcto!"</p></li>
<li><p><strong>Pare mientras sea divertido.</strong> Una sesión corta y alegre es mejor que una larga y cansada.</p></li>
<li><p><strong>Lea el libro.</strong> Explica por qué es importante cada actividad y en qué fijarse.</p></li>
<li><p><strong>Jueguen con las placas de los carros.</strong> Cuando vayan en el carro, pida al niño que mire rápido una placa cercana, que voltee a otro lado y que la diga. Revísela solo cuando el carro esté parado, o deje que otro pasajero la revise.</p></li>
<li><p><strong>Escuche.</strong> Haga clic en 🔊 para oír la ayuda en voz alta. Después de SHOW ANSWER, haga clic en <strong>🔊 Hear it in English</strong> (escuchar en inglés) para oír las letras o la palabra dichas en inglés. La voz de la computadora dice bien los nombres de las letras y las palabras completas, pero no los sonidos sueltos de las letras.</p></li>
<li><p><strong>Pruébelo usted mismo.</strong> Muchas personas se sorprenden de cuánto pueden mejorar con un poco de práctica.</p></li>
</ul>

=\"allnum\">Upper + lowercase letters + numbers (no shapes)</option><option value=\"mixed\">Mixed (letters, numbers, shapes)</option></select><label for=\"mode\">Activity</label><select id=\"mode\"><option value=\"recall\">Flash & Recall</option><option value=\"flip\">Find the Flip</option><option value=\"shapes\">Shape Quest</option><option value=\"wordorder\">Word Order \u00b7 Forward / Reverse</option></select></div></div><div id=\"orderDirectionRow\" style=\"display:none;margin:10px 0;background:#173e70;border:1px solid #a9c8e8;border-radius:9px;padding:10px\"><label for=\"orderDirection\" style=\"font-weight:700\">Word Order direction</label><select id=\"orderDirection\"><option value=\"forward\" selected>Forward (default) \u00b7 read letters left to right</option><option value=\"reverse\">Reverse \u00b7 say letters right to left</option></select><div class=\"hint\">Begin with Forward. Use Reverse only for the later book exercise. The displayed word is unchanged; only the requested response changes.</div></div><div id=\"wordControls\" class=\"word-controls\" style=\"margin:10px 0;background:#173e70;border:1px solid #a9c8e8;border-radius:9px;padding:10px\"><div class=\"grid2\"><div><label for=\"wordUse\">Presentation</label><select id=\"wordUse\"><option value=\"symbols\">Individual symbols (original)</option><option value=\"words\">Real words</option></select></div><div><label for=\"wordCase\">Word letter case</label><select id=\"wordCase\"><option value=\"lower\">lowercase (default)</option><option value=\"upper\">UPPERCASE</option><option value=\"sentence\">Sentence Case</option></select></div></div><div class=\"grid2\"><div><label for=\"wordLength\">Word length</label><select id=\"wordLength\"><option value=\"3\">3 letters (default)</option><option value=\"2\">2 letters</option><option value=\"4\">4 letters</option><option value=\"all\">All lengths (2\u20134)</option></select></div><div style=\"display:flex;align-items:end\"><button type=\"button\" id=\"editWords\" class=\"secondary\" style=\"width:100%;min-height:42px\">\u270e EDIT WORD LISTS</button></div></div><div class=\"hint\" id=\"wordHint\">For real-word activities, choose Real words. Custom lists are saved in this browser.</div></div><div id=\"wordEditor\" hidden role=\"dialog\" aria-modal=\"true\" aria-label=\"Edit Advanced Mode word lists\" style=\"position:fixed;z-index:200;left:50%;top:4vh;transform:translateX(-50%);width:min(620px,calc(100vw - 20px));max-height:92vh;overflow:auto;background:#244a7b;border:3px solid #f5c45b;border-radius:12px;padding:18px;box-shadow:0 0 0 100vmax #081528bb\"><button type=\"button\" id=\"closeWordEditor\" style=\"float:right\">\u2715 Close</button><h2>Advanced word lists</h2><p>One word per line, or separate with commas/spaces. Custom words supplement the built-in familiar-word list. For Word Order, enter reversible pairs as <strong>saw,was</strong> (one pair per line). Pairs are checked for exact reverse spelling.</p><label for=\"customWords\">Additional words (2\u20134 letters)</label><textarea id=\"customWords\" rows=\"6\" style=\"width:100%;min-height:110px;background:#173e70;color:white;border:2px solid #a9c8e8;border-radius:7px;padding:9px;font:inherit\" placeholder=\"cat&#10;bed&#10;fish\"></textarea><label for=\"customPairs\">Additional reversible pairs (one pair per line)</label><textarea id=\"customPairs\" rows=\"5\" style=\"width:100%;min-height:95px;background:#173e70;color:white;border:2px solid #a9c8e8;border-radius:7px;padding:9px;font:inherit\" placeholder=\"saw,was&#10;top,pot\"></textarea><div class=\"buttons\"><button type=\"button\" id=\"saveWordLists\">SAVE LISTS</button><button type=\"button\" id=\"resetWordLists\" class=\"secondary\">CLEAR CUSTOM LISTS</button></div><div class=\"hint\" id=\"wordEditorStatus\" role=\"status\"></div></div><div class=\"grid2\"><div><label for=\"duration\">Exposure time</label><select id=\"duration\"><option value=\"17\">~17 ms (60 Hz: 1 frame)</option><option value=\"33\  & Recall \u2014 normal characters. Select Find the Flip above to enable reversals.</div><details class=\"guide-options optional\"><summary>Lowercase alignment guides</summary><label for=\"guides\">Lowercase alignment guides</label><select id=\"guides\"><option value=\"off\">Off</option><option value=\"base\">Baseline only</option><option value=\"three\">Three-line guide</option></select><div class=\"check\"><input id=\"persistentGuide\" type=\"checkbox\"><label for=\"persistentGuide\">Keep guide lines visible between flashes</label></div><div class=\"hint\">Guides are for exploring letter position; alignment varies by font and device.</div></details><details style=\"margin-top:12px\"><summary>Advanced colors</summary><div class=\"grid2\"><div><label for=\"fg\">Foreground</label><input id=\"fg\" type=\"color\" value=\"#ffffff\"></div><div><label for=\"bg\">Background</label><input id=\"bg\" type=\"color\" value=\"#000000\"></div></div></details><div class=\"hint\">For dual-screen use, open the second display, move that window to the external monitor, and maximize it. Browsers may block popups unless opened by clicking this button.</div></section><section><div class=\"panel\"><div class=\"toolbar\"><h2 style=\"margin:0\">Stimulus display</h2><span class=\"pill\" id=\"status\">Ready</span></div><div id=\"stage\" class=\"stage\" tabindex=\"0\"><div id=\"stim\" class=\"stim\"></div><div id=\"msg\" class=\"message\">Press Flash to begin</div><div id=\"stageAnswer\" class=\"stage-answer\" hidden></div></div><div class=\"buttons actions run-controls\"><button id=\"start\">\u26a1 FLASH! (Space)</button><button id=\"review\">\u25c9 REVIEW</button><button id=\"next\">NEXT TRIAL</button><button id=\"hide\">HIDE</button><button id=\"reveal\">SHOW ANSWER</button><button id=\"practice\">Practice / Hold</button></div><div class=\"run-extra-row\"><div class=\"run-colors\"><span class=\"run-colors-label\">Colors:</span><div class=\"presets\"><button class=\"preset\" data-fg=\"#fffff "hint\">Performance goals are exploratory. For a reliability criterion, try \u22658 correct out of 10 trials under identical conditions. This is not a clinical norm or validated threshold. Results stay in this browser session until exported; no patient data is transmitted.</p></div><p class=\"hint\" style=\"padding:0 8px\">Flash Trainer is an educational and developmental exploration tool, not a standardized diagnostic instrument. Very brief exposure times are limited by the display refresh rate and operating environment. Avoid use with individuals who are sensitive to flashing visual stimuli. Version 1.1 prototype.</p></section></main><script>\n'use strict';const $=id=>document.getElementById(id),U='ABCDEFGHJKLMNPRSTUVWXYZ',L='abcdefghjkmnprstuvwxyz',N='2345679',SH=['circle','square','triangle','rectangle','diamond','pentagon','hexagon','star'];let reviewHighlight=false,trial=null,records=[],running=false,practice=false,second=null,raf=0,fixTimer=0,hideTimer=0,sequence=0;const rand=n=>Math.floor(Math.random()*n),pick=a=>a[rand(a.length)],shuffle=a=>a.map(x=>({x,r:Math.random()})).sort((a,b)=>a.r-b.r).map(v=>v.x);const escapeHtml=s=>String(s).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));function kindPool(kind){if(kind==='upper')return [...U];if(kind==='lower')return [...L];if(kind==='numbers')return [...N];if(kind==='alpha')return [...U+L];if(kind==='uppernum')return [...U+N];if(kind==='lowernum')return [...L+N];if(kind==='allnum')return [...U+L+N];if(kind==='shapes')return SH.map(s=>'shape:'+s);return [...U+L+N,...SH.map(s=>'shape:'+s)];}const BASE_WORDS=['no','on','to','at','in','it','up','us','am','me','we','he','be','so','go','do','an','as','is','if','of','or','by','my','hi','oh','cat','bed','sun','sit','cup','dog','pen','jam','fish','hand','ship','book','milk','moon','ball','tree','bird','home','cake','desk','sock','leaf','star','stop','snap','part','live','trap','pots','rats','pans','evil','was','saw','top','pot' let active=null;
window.startTour=function(mode){if(active)active.stop();switchMode(mode);const frame=mode==='advanced'?advancedFrame:bookFrame;let doc,win;try{doc=frame.contentDocument;win=frame.contentWindow}catch(e){return}if(!doc||!doc.body)return;if(!doc.getElementById('fqTourCss')){const st=doc.createElement('style');st.id='fqTourCss';st.textContent=CSS;doc.head.appendChild(st)}
const steps=(FQ.lang==='es'?FQ.TOURS_ES:TOURS)[mode];let i=0,cleanup=null;const spot=doc.createElement('div');spot.className='fq-spot';const box=doc.createElement('div');box.className='fq-tour';box.setAttribute('role','dialog');box.setAttribute('aria-live','polite');doc.body.appendChild(spot);doc.body.appendChild(box);

function show(){if(cleanup){cleanup();cleanup=null}const [sel,text,doIt]=steps[i];const el=doc.querySelector(sel);if(el&&el.scrollIntoView)el.scrollIntoView({block:'nearest'});const last=i===steps.length-1;box.innerHTML='<div class="fq-step">'+FQ.t('step').replace('{n}',i+1).replace('{m}',steps.length)+'</div><p></p>'+(doIt?'<div class="fq-do"></div>':'')+'<div class="fq-row">'+(FQ.canSpeak?'<label class="fq-auto"><input type="checkbox" data-a="auto"> '+FQ.t('autoRead')+'</label><button type="button" data-a="say">🔊</button>':'')+'<button type="button" data-a="stop">'+FQ.t('stop')+'</button><button type="button" data-a="back">'+FQ.t('back')+'</button><button type="button" data-a="next" class="fq-primary">'+(last?FQ.t('finish'):FQ.t('next'))+'</button></div>';box.querySelector('p').textContent=text;if(doIt)box.querySelector('.fq-do').textContent='👉 '+doIt;box.querySelector('[data-a=back]').disabled=i===0;const sayIt=()=>FQ.speak(text+(doIt?'. '+doIt:''),FQ.lang,'tour'+i);const sb=box.querySelector('[data-a=say]');if(sb){sb.setAttribute('aria-label',FQ.t('listen'));sb.onclick=sayIt;const au=box.querySelector('[data-a=auto]');let a=false;try{a=localStorage.getItem('flashquest_tour_autoread')==='1'}catch(e){}au.checked=a;au.onchange=()=>{try{localStorage.setItem('flashquest_tour_autoread',au.checked?'1':'0')}catch(e){}if(au.checked)sayIt();else FQ.stopSpeech()};if(a)setTimeout(sayIt,150)}box.querySelector('[data-a=stop]').onclick=stop;box.querySelector('[data-a=back]').onclick=()=>{i--;show()};box.querySelector('[data-a=next]').onclick=()=>{if(last)stop();else{i++;show()}};if(doIt&&el){const h=()=>{if(i<steps.length-1){i++;show()}};el.addEventListener('click',h);cleanup=()=>el.removeEventListener('click',h)}place();setTimeout(place,60);box.querySelector('[data-a=next]').focus({preventScroll:true})}

(function(){
const ok='speechSynthesis' in window&&'SpeechSynthesisUtterance' in window;
let voices=[];function loadV(){try{voices=speechSynthesis.getVoices()}catch(e){}}if(ok){loadV();speechSynthesis.onvoiceschanged=loadV}
function voiceFor(l){loadV();const pre=l==='es'?'es':'en';const v=voices.filter(v=>(v.lang||'').toLowerCase().startsWith(pre));return v.find(x=>/US|MX|419/i.test(x.lang)&&x.localService)||v.find(x=>x.localService)||v[0]||null}

let lastKey='';

 const sameAgain=speechSynthesis.speaking&&key&&key===lastKey;speechSynthesis.cancel();lastKey='';if(sameAgain)return;
 const v=voiceFor(l);if(!v&&l==='es')toast('No hay una voz en español instalada en esta computadora. Se usará la voz disponible.');
 const u=new SpeechSynthesisUtterance(String(text).replace(/[📘🏠▶👉✕◀🔊]/gu,' '));u.lang=v?v.lang:(l==='es'?'es-MX':'en-US');if(v)u.voice=v;u.rate=.9;lastKey=key||'';u.onend=()=>{if(lastKey===key)lastKey=''};speechSynthesis.speak(u)};

const gl=document.getElementById('guideListen');if(gl){if(!ok)gl.hidden=true;gl.onclick=()=>{const gb=document.getElementById('guideBody'),hs=[...gb.querySelectorAll('h1,h2')];const top=gb.getBoundingClientRect().top;let cur=hs[0];for(const h of hs){if(h.getBoundingClientRect().top-top<=24)cur=h}const parts=[cur.textContent];let n=cur.nextElementSibling;while(n&&!/^H[12]$/.test(n.tagName)){if(n.tagName==='TABLE'){[...n.querySelectorAll('tr')].slice(1).forEach(r=>parts.push([...r.cells].map(c=>c.textContent).join(': ')))}else parts.push(n.textContent);n=n.nextElementSibling}FQ.speak(parts.join('. ').replace(/\s+/g,' '),FQ.lang,'guide')}}

function spokenTokens(tokens){return tokens.map(t=>/^[a-z]$/i.test(t)?t.toUpperCase():t).join(', ')}
function bookSay(doc){const ov=doc.getElementById('answerOverlay'),stim=doc.getElementById('stimulus');const en=[...ov.childNodes].filter(n=>!(n.nodeType===1&&n.classList.contains('fq-es'))).map(n=>n.textContent).join('').trim();const vis=(stim.textContent||'').trim();
 if(!vis||/[←→↑↓↖↗↙↘●+]/.test(vis))return en;const toks=vis.split(/\s+/);if(toks.length>1)return spokenTokens(toks);return /^[a-z]$/i.test(vis)?vis.toUpperCase():vis}
function advSay(doc){const t=doc.getElementById('stageAnswer').textContent.trim();let m;if(m=t.match(/^Word: ([^.]+)\./))return m[1];if(m=t.match(/^Sequence: (.+?)\.(\s|$)/))return spokenTokens(m[1].split(/\s+/));return t}
const CSS='.fq-hear{position:absolute;top:10px;right:10px;z-index:3;min-height:0!important;font:700 14px Arial,sans-serif!important;padding:6px 11px!important;border-radius:8px!important;border:2px solid #f5c45b!important;background:#173e70!important;color:#fff!important;cursor:pointer;line-height:1.2}.fq-hear .fq-es{font-size:.8em}'+
