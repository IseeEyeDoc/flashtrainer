<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Flash Trainer — Book & Advanced</title><style>*{box-sizing:border-box}body{margin:0;background:#10233d;color:#fff;font-family:system-ui,Segoe UI,Arial,sans-serif}.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:12px 18px;background:#102b50;border-bottom:3px solid #e8c76a}.brand{font-size:22px;font-weight:800}.fullscreen-hint{display:none;color:#f5d878;font-size:15px;font-weight:600;white-space:nowrap}@media(min-width:900px){.fullscreen-hint.windows{display:inline}}.switch{display:flex;gap:8px;flex-wrap:wrap}.switch button{font:700 17px system-ui,Arial;padding:13px 22px;border-radius:11px;border:2px solid #e8c76a;background:#25456f;color:#fff;cursor:pointer}.switch button.active{background:#e8c76a;color:#142a4b;box-shadow:0 0 0 2px #fff4}.frame{width:100%;height:calc(100dvh - 82px);min-height:0;border:0;background:#3e5e91;display:block}@media(max-width:620px){.top{justify-content:center}.frame{height:calc(100dvh - 135px)}.switch button{padding:10px 16px}}</style></head><body><div class="top"><div class="brand">Flash Trainer <span style="font-size:13px;font-weight:400;color:#e8c76a">v1.6.4</span></div><span id="fullscreenHint" class="fullscreen-hint">Press F11 for full screen · F11 again to return</span><div class="switch" role="group" aria-label="Choose operating mode"><button id="bookBtn" class="active" aria-pressed="true">📖 BOOK MODE</button><button id="advancedBtn" aria-pressed="false">⚙ ADVANCED MODE</button></div></div><iframe id="bookFrame" class="frame" title="Flash Trainer Book Mode"></iframe><iframe id="advancedFrame" class="frame" title="Flash Trainer Advanced Mode" style="display:none"></iframe><script>if(/Windows/i.test(navigator.userAgent))document.getElementById("fullscreenHint").classList.add("windows");const bookHTML="<!doctype html><html lang=\"en\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><title>Flash Trainer \u2014 Book Mode prototype v1.4.1</title><style>\n:root{font-family:Segoe UI,Arial,sans-serif;color:#fff;background:#214d82}*{box-sizing:border-box}body{margin:0}header{background:#173e70;border-bottom:3px solid #f5c45b;padding:13px clamp(12px,3vw,30px)}header h1{font-size:clamp(24px,3vw,32px);margin:0}header p{margin:2px 0;color:#e4edf9}.shell{max-width:1150px;margin:auto;padding:16px;display:grid;grid-template-columns:320px minmax(0,1fr);gap:16px}.panel{background:#2d6098;border:1px solid #8bb9e1;border-radius:13px;padding:18px}h2{font-size:20px;margin:0 0 12px}label{display:block;margin:12px 0 5px;font-weight:600}select,input,textarea{font:inherit;width:100%;background:#173e70;color:white;border:1px solid #abc7e5;border-radius:7px;padding:9px;min-height:40px}button{font:inherit;font-weight:700;border:0;border-radius:9px;min-height:48px;padding:10px 13px;cursor:pointer;background:#f5c45b;color:#17304d}button:disabled{opacity:.45;cursor:not-allowed}button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible,summary:focus-visible,textarea:focus-visible{outline:3px solid #ffdf7b;outline-offset:3px}.buttons{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.buttons button{font-size:16px}.flash{background:#b91c1c;color:#fff;border:2px solid #ffb0a7}.review{background:#79523b;color:white}.answer{background:#173e70;color:white;border:1px solid #d6e4f4}.next{background:#f5c45b;color:#17304d}.stage{height:clamp(245px,39vw,400px);background:#080c13;border:3px solid #f5c45b;border-radius:12px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;margin:12px 0}.stimulus{font-family:Arial,sans-serif;font-weight:500;white-space:nowrap;max-width:96%;line-height:1.1;text-align:center;letter-spacing:.08em}.stage-note{position:absolute;bottom:13px;color:#b9c9d8;font-size:13px;text-align:center;left:8px;right:8px}.intro{color:#eaf2ff;line-height:1.45;font-size:15px;min-height:64px}.small{font-size:13px;color:#e0edfb;line-height:1.4}.status{min-height:26px;font-weight:600;color:#ffe5a0}.feedback{background:#173e70;border-left:4px solid #f5c45b;padding:12px;border-radius:6px;margin-top:13px;min-height:47px;line-height:1.45}.advanced{margin-top:14px;font-size:14px}.advanced a{color:#fff;text-decoration:underline}details{margin-top:15px;background:#1d4d7d;border-radius:9px;padding:12px}summary{cursor:pointer;font-weight:700}details p{font-size:13px;line-height:1.4}.toggle{display:flex;align-items:center;gap:10px;margin:12px 0}.toggle input{width:19px;min-height:19px;accent-color:#f5c45b}.toggle label{margin:0}.levels{font-size:14px;margin:8px 0 13px}.foot{max-width:1150px;margin:0 auto 25px;padding:0 18px;color:#e6f0fc;font-size:13px;line-height:1.5}.hint{background:#173e70;border-radius:8px;padding:10px;font-size:13px;line-height:1.45;margin-top:14px}@media(max-width:790px){.shell{grid-template-columns:1fr}.panel{padding:14px}.stage{height:260px}.buttons button{font-size:14px;padding:8px 4px}.intro{min-height:0}}@media(max-width:360px){.buttons{grid-template-columns:repeat(2,minmax(0,1fr))}}\ntextarea{font:inherit;width:100%;min-height:90px;background:#173e70;color:#fff;border:1px solid #abc7e5;border-radius:7px;padding:9px;resize:vertical}.word-editor{margin-top:13px;border:1px solid #8bb9e1;border-radius:9px;padding:11px;background:#204d7e}.word-editor button{min-height:38px;font-size:13px;padding:7px 9px}.word-actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}.word-actions button{flex:1 1 100px}.word-msg{font-size:13px;min-height:20px;margin-top:7px;color:#ffe5a0}.word-count{font-size:13px;color:#e0edfb;margin-top:7px} .word-editor[hidden]{display:none}\n/* High-contrast placeholders: do not rely on browser's low-opacity defaults. */\ninput::placeholder,textarea::placeholder{color:#F1F6FF;opacity:1}\ninput::-webkit-input-placeholder,textarea::-webkit-input-placeholder{color:#F1F6FF;opacity:1}\ninput::-moz-placeholder,textarea::-moz-placeholder{color:#F1F6FF;opacity:1}\ninput:focus,textarea:focus{background:#102F58}\n\n.answer-overlay{position:absolute;bottom:38px;left:16px;right:16px;padding:12px 16px;border:2px solid #f5c45b;border-radius:10px;background:#173e70;color:#fff;font-size:clamp(17px,2.2vw,25px);font-weight:750;text-align:center;line-height:1.35;box-shadow:0 4px 18px #0009;z-index:2}.answer-overlay[hidden]{display:none!important}\n/* v1.5.1: Keep practice editor out of the page flow. */\n.list-modal{position:fixed;z-index:1000;inset:4vh auto auto 50%;transform:translateX(-50%);width:min(580px,calc(100vw - 24px));max-height:92vh;overflow-y:auto;background:#244a7b;border:3px solid #e8c76a;border-radius:13px;padding:20px;box-shadow:0 0 0 100vmax rgba(4,13,27,.73),0 18px 50px #0009}\n.list-modal[hidden]{display:none!important}\n.close-lists{float:right;background:#f5c45b;color:#17304d;min-height:38px;padding:6px 13px}\n.list-modal textarea{min-height:65px}\n.list-modal label{margin-top:9px}\n.list-modal button{min-height:38px}\n.shell{max-width:1260px;grid-template-columns:315px minmax(0,1fr);gap:14px;padding:12px}\n.panel{padding:14px}\n.stage{height:clamp(210px,33vh,340px)}\n.intro{min-height:0}\nheader{padding-top:8px;padding-bottom:8px}\n@media(max-width:700px){.shell{grid-template-columns:1fr}.stage{height:240px}}\n\n/* v1.5.3: operator readability; moderate increases without enlarging stimulus */\n.intro{font-size:16px;line-height:1.35}\n.small,.hint,.foot,details p{font-size:15px;line-height:1.35}\n.levels,.advanced{font-size:15px}\n.stage-note{font-size:15px}\n.status{font-size:16px}\n.feedback{font-size:16px;line-height:1.35;padding:10px;min-height:43px;margin-top:10px}\n.panel label,.panel select,.panel input,.panel textarea{font-size:16px}\n.word-count,.word-msg{font-size:15px}\n.list-modal p{font-size:16px;line-height:1.35}\n/* Recover vertical space without shrinking text */\n.shell{padding-top:10px;padding-bottom:8px}\n.panel{padding:13px}\nlabel{margin-top:9px}\n.hint{margin-top:10px;padding:9px}\n.foot{margin-bottom:10px}\n</style><style>.screen-orientation{background:#173e70;border:2px solid #e8c76a;border-radius:10px;padding:9px 11px;margin:0 0 12px}.screen-orientation label{margin:0 0 5px;font-weight:750}.screen-orientation select{width:100%;font-size:16px;min-height:40px}.screen-help{font-size:14px;line-height:1.3;color:#fff0b5;margin-top:6px}</style></head><body><header><h1>Flash Trainer <span style=\"font-size:13px;font-weight:400;color:#f5c45b\">Book Mode \u00b7 unified v1.5</span></h1><p>See It. Spot It. Solve It. \u2014 A companion activity for <em>The Invisible Step Before Reading Begins</em></p></header><main class=\"shell\"><section class=\"panel\"><div class=\"screen-orientation\"><label for=\"screenOrientation\">Screen position</label><select id=\"screenOrientation\"><option value=\"upright\">Screen: Upright</option><option value=\"flat\">Screen: Lying flat</option></select><div class=\"screen-help\">Which way is the screen facing? Use the words that are true for it.</div></div><h2>Choose an activity</h2><label for=\"activity\">Activity</label><select id=\"activity\"><option value=\"direction\">1 \u00b7 Direction & Position</option><option value=\"letters\">2 \u00b7 Letter Identity</option><option value=\"order\">3 \u00b7 Position & Order</option><option value=\"custom\">4 \u00b7 My Practice List</option></select><div id=\"intro\" class=\"intro\"></div><button id=\"openLists\" type=\"button\" style=\"width:100%;margin:10px 0;background:#efc75d;color:#12294a;border:2px solid #fff;font-weight:800\">\u270e EDIT LISTS \u00b7 LETTERS / NUMBERS / WORDS</button><div id=\"quickLists\" hidden role=\"dialog\" aria-modal=\"true\" aria-label=\"Edit practice lists\" class=\"list-modal\"><button type=\"button\" id=\"closeLists\" class=\"close-lists\" aria-label=\"Close list editor\">\u2715 Close</button><h2 style=\"font-size:20px;margin:0 0 8px\">My Practice List</h2><p style=\"margin:4px 0 12px\">Enter one item or paste several. Each item is shown separately. Use commas, spaces, or new lines between items.</p><label for=\"quickType\">List to edit</label><select id=\"quickType\"><option value=\"letters\">Letters</option><option value=\"numbers\">Numbers</option><option value=\"words\">Words</option></select><label for=\"quickInput\">Add items (one or many)</label><textarea id=\"quickInput\" style=\"width:100%;min-height:94px;background:#172e55;color:white;font:inherit;border:2px solid #d9e9ff;border-radius:8px;padding:10px\" placeholder=\"Examples: b, d, p, q or 3, 6, 9 or bad, bed, bid\"></textarea><div style=\"display:flex;flex-wrap:wrap;gap:8px;margin:10px 0\"><button id=\"quickAdd\" type=\"button\" style=\"background:#e8c76a;color:#172b48\">ADD TO LIST</button><button id=\"quickReplace\" type=\"button\" style=\"background:#76543e;color:white\">REPLACE LIST</button><button id=\"quickClear\" type=\"button\">CLEAR LIST</button></div><label for=\"quickCurrent\">Current list (editable)</label><textarea id=\"quickCurrent\" style=\"width:100%;min-height:94px;background:#172e55;color:white;font:inherit;border:2px solid #d9e9ff;border-radius:8px;padding:10px\"></textarea><button id=\"quickSave\" type=\"button\" style=\"background:#e8c76a;color:#172b48;margin-top:8px\">SAVE EDITED LIST</button><p id=\"quickStatus\" role=\"status\" style=\"color:#fff4c4;min-height:20px;margin:9px 0 0\"></p><p style=\"font-size:13px\">Saved in this browser only. The standard activity lists are unchanged.</p></div><label for=\"difficulty\">Challenge level</label><select id=\"difficulty\"><option value=\"0\">1 \u00b7 Beginning</option><option value=\"1\">2 \u00b7 Developing</option><option value=\"2\">3 \u00b7 Confident</option><option value=\"3\">4 \u00b7 Extra challenge</option></select><div id=\"letterOptions\" style=\"margin-top:9px\" hidden><label for=\"letterPresentation\">Letter Identity presentation</label><select id=\"letterPresentation\"><option value=\"random\">Random letters (not words) \u00b7 default</option><option value=\"words\">Real words \u00b7 optional reading practice</option></select><div id=\"letterOptionsHelp\" class=\"small\" style=\"margin-top:5px\">Recognize and recall individual letter identities in a sequence.</div></div><div class=\"hint\" id=\"guide\"></div><details><summary>Presentation settings (optional)</summary><label for=\"exposure\">Display duration</label><select id=\"exposure\"><option value=\"0\">Teaching \u00b7 stays visible</option><option value=\"1000\" selected>1 second</option><option value=\"500\">500 milliseconds</option><option value=\"300\">300 milliseconds</option><option value=\"200\">200 milliseconds</option></select><label for=\"fontSize\">Symbol size</label><select id=\"fontSize\"><option value=\"56\">Small</option><option value=\"76\" selected>Medium</option><option value=\"100\">Large</option></select><div class=\"toggle\"><input type=\"checkbox\" id=\"fix\" checked><label for=\"fix\">Show fixation cross before flash</label></div><p>Timing is approximate and depends on the device's screen refresh. This is not a standardized test. Begin untimed when teaching a new skill.</p></details><div class=\"word-editor\" id=\"wordEditor\" hidden><h2 style=\"font-size:17px;margin-bottom:7px\">Word lists</h2><label for=\"wordLevel\">Edit words for</label><select id=\"wordLevel\"><option value=\"2\">Level 3 \u00b7 Familiar short words</option><option value=\"3\">Level 4 \u00b7 Extra challenge</option></select><label for=\"wordSource\">Use this list during practice</label><select id=\"wordSource\"><option value=\"standard\">Built-in standard list</option><option value=\"custom\">My custom list</option></select><div class=\"word-count\" id=\"wordCount\"></div><label for=\"singleWord\">Add one word</label><div style=\"display:flex;gap:7px\"><input id=\"singleWord\" maxlength=\"24\" placeholder=\"e.g., bud\" autocomplete=\"off\"><button id=\"addWord\" type=\"button\">Add</button></div><label for=\"bulkWords\">Add several words (paste or type)</label><textarea id=\"bulkWords\" placeholder=\"Paste words separated by commas, spaces, or new lines.&#10;bad, bed, bid, bud\"></textarea><div class=\"word-actions\"><button id=\"addBulk\" type=\"button\">Add words</button><button id=\"replaceWords\" type=\"button\" class=\"review\">Replace custom list</button><button id=\"restoreWords\" type=\"button\" class=\"answer\">Restore defaults</button></div><p class=\"small\">Custom lists are saved in this browser on this device. No names or results are saved. Choose \u201cMy custom list\u201d to use your additions; the original standard list is always available.</p><div class=\"word-msg\" id=\"wordMsg\" role=\"status\"></div></div></section><section class=\"panel\"><h2 id=\"stageTitle\">Direction & Position</h2><div class=\"small\" id=\"prompt\">Ask the child to point in the direction shown.</div><div class=\"stage\" id=\"stage\" aria-live=\"off\"><div class=\"stimulus\" id=\"stimulus\"></div><div class=\"answer-overlay\" id=\"answerOverlay\" hidden></div><div class=\"stage-note\" id=\"stageNote\">Choose Flash to begin</div></div><div class=\"status\" id=\"status\">Ready for a new trial</div><div class=\"levels\" id=\"levelInfo\">Level 1 \u00b7 Beginning</div><div class=\"buttons\"><button id=\"easier\">\u2212 Easier</button><button id=\"flash\" class=\"flash\">FLASH</button><button id=\"harder\">+ Harder</button><button id=\"review\" class=\"review\">REVIEW</button><button id=\"answer\" class=\"answer\">SHOW ANSWER</button><button id=\"next\" class=\"next\">NEXT</button></div><div class=\"feedback\" id=\"feedback\">An adult can listen to the child's answer. There is no automatic scoring.</div><p class=\"small\">Review shows the exact previous stimulus without identifying the answer. Show Answer explains it. Next clears the trial; Flash creates a new one.</p></section></main><div class=\"foot\">Educational exploration and guided practice only. Flash Trainer is not a diagnostic instrument or a proven treatment for reading disorders. No names, accounts, or results are collected by this page. <strong>Prototype note:</strong> Book Mode and Advanced Mode are contained in one downloadable HTML file.</div><script>\n(()=>{'use strict';const $=id=>document.getElementById(id);let trial=null,token=0,frame=0,timer=0,showing=false,reviewing=false;const levels=['Beginning','Developing','Confident','Extra challenge'];const instructions={direction:['Look at the direction or position shown. Respond by pointing or placing a token.','Ask: \u201cWhich direction?\u201d or \u201cWhere is the dot from the plus sign?\u201d','Start with clear arrows; advance to positions around a center.'],letters:['Identify the letter, say its sound if known, or read a familiar short word.','Ask: \u201cWhat letter or word did you see?\u201d Teach and correct untimed first.','A brief presentation is a challenge, not a substitute for phonics instruction.'],custom:['Practice your own letters, numbers, or words.','Select a list, then Flash to show a randomly selected item.','Use Edit Practice Lists to add or change items.'],order:['Remember which symbol came first, last, or in the middle.','Ask: \u201cWhich was first? Which was last?\u201d For higher levels, repeat the full order.','Use spoken answers or arrange physical letter/number cards.']};const defaultWords={2:['bad','dad','bed','bid','big','dig','dip','pig','pod','bog'],3:['bad','dab','pad','dip','bid','pig','dog','bog','big','dig']};const storeKey='flashquest_book_words_v1';let customWords={2:[...defaultWords[2]],3:[...defaultWords[3]]};let wordSource={2:'standard',3:'standard'};try{let saved=JSON.parse(localStorage.getItem(storeKey)||'null');if(saved){for(let k of [2,3]){if(Array.isArray(saved.words?.[k]))customWords[k]=cleanWords(saved.words[k]);if(['standard','custom'].includes(saved.sources?.[k]))wordSource[k]=saved.sources[k]}}}catch(e){}function cleanWords(items){return [...new Set(items.map(w=>String(w).trim().toLowerCase()).filter(w=>/^[a-z]{1,24}$/.test(w)))].slice(0,300)}function parseWords(raw){return cleanWords(raw.split(/[\\\\s,;]+/))}function persistWords(){try{localStorage.setItem(storeKey,JSON.stringify({words:customWords,sources:wordSource}))}catch(e){$('wordMsg').textContent='Browser storage is unavailable; changes will last only until this page closes.'}}function editLevel(){return +$('wordLevel').value}function updateWordEditor(){let k=editLevel();$('wordSource').value=wordSource[k];$('wordCount').textContent=`Built-in: ${defaultWords[k].length} words \u00b7 Custom: ${customWords[k].length} words`;if(!$('wordMsg').textContent)$('wordMsg').textContent='The built-in list is never overwritten.'}function wordMessage(t){$('wordMsg').textContent=t;updateWordEditor()}function addWords(items,replace){let k=editLevel();if(!items.length){wordMessage('Enter one or more words containing letters A\u2013Z only.');return}let before=customWords[k].length;customWords[k]=replace?items:cleanWords([...customWords[k],...items]);wordSource[k]='custom';persistWords();updateWordEditor();$('wordMsg').textContent=replace?`Custom list replaced with ${customWords[k].length} words.`:`Added ${customWords[k].length-before} new words; duplicates skipped.`;reset()}const quickDefaults={letters:['b','d','p','q'],numbers:['3','6','9'],words:['bad','bed','bid','dad']};let quickLists={};try{quickLists=JSON.parse(localStorage.getItem('flashquest_quick_lists_v1')||'{}')}catch(e){}for(const t of Object.keys(quickDefaults)){if(!Array.isArray(quickLists[t]))quickLists[t]=[...quickDefaults[t]]}function quickType(){return $('quickType').value}function parseQuick(s,t){const regex=t==='numbers'?/^[0-9]{1,12}$/:t==='letters'?/^[a-zA-Z]{1,12}$/:/^[a-zA-Z]{1,24}$/;return [...new Set(s.split(/[\\s,;]+/).map(x=>x.trim()).filter(x=>regex.test(x)))].slice(0,300)}function saveQuick(){try{localStorage.setItem('flashquest_quick_lists_v1',JSON.stringify(quickLists))}catch(e){$('quickStatus').textContent='Browser storage unavailable: changes may not persist.'}}function renderQuick(){$('quickCurrent').value=quickLists[quickType()].join(', ');$('quickStatus').textContent=quickLists[quickType()].length+' items in this list.'}const rand=n=>Math.floor(Math.random()*n);const pick=a=>a[rand(a.length)];function clearPending(){token++;clearTimeout(timer);cancelAnimationFrame(frame);showing=false;$('flash').disabled=false}function getActivity(){return $('activity').value}function getLevel(){return +$('difficulty').value}function screenDirection(v){if($('screenOrientation').value!=='flat')return v;return ({up:'away from you',down:'toward you','up and left':'away from you and to the left','up and right':'away from you and to the right','down and left':'toward you and to the left','down and right':'toward you and to the right'})[v]||v;}function screenPosition(v){if($('screenOrientation').value!=='flat')return v;return ({above:'farther from you than',below:'nearer to you than'})[v]||v;}function newTrial(){let mode=getActivity(),lv=getLevel(),visual='',answer='',prompt='';if(mode==='custom'){let t=quickType(),items=quickLists[t];if(!items.length)items=quickDefaults[t];visual=pick(items);answer='Presented: '+visual+'.';prompt='Identify the '+(t==='words'?'word':t==='numbers'?'number':'letter')+' shown.'}else if(mode==='direction'){if(lv===0){let d=pick([['\u2190','left'],['\u2192','right'],['\u2191','up'],['\u2193','down']]);visual=d[0];answer='The arrow points '+screenDirection(d[1])+'.';prompt='Point in the direction of the arrow.'}else if(lv===1){let d=pick([['\u25cf  +','left'],['+  \u25cf','right']]);visual=d[0];answer='The dot is to the '+d[1]+' of the plus sign.';prompt='Where is the dot from the plus sign?'}else if(lv===2){let d=pick([['\u25cf\\n+','above'],['+\\n\u25cf','below']]);visual=d[0];answer='The dot is '+screenPosition(d[1])+' the plus sign.';prompt='Where is the dot from the plus sign?'}else{let d=pick([['\u2196','up and left'],['\u2197','up and right'],['\u2199','down and left'],['\u2198','down and right']]);visual=d[0];answer='The arrow points '+screenDirection(d[1])+'.';prompt='Point in the direction of the arrow.'}}else if(mode==='letters'){if(lv===0){let c=pick(['b','d','p','q']);visual=c;answer='The letter is '+c+'.';prompt='Name the letter. If learned, say its sound.'}else if(lv===1){let c=pick(['b d','d b','p q','q p','b p','d q']);visual=c;answer='The letters, from left to right, are '+c.split(' ').join(', ')+'.';prompt='Name the letters from left to right.'}else if($('letterPresentation').value==='words'){let words=wordSource[lv]==='custom'?customWords[lv]:defaultWords[lv];if(!words.length)words=defaultWords[lv];let w=pick(words);visual=w;answer='The word is \u201c'+w+'\u201d. Ask the child to blend its sounds, not merely guess its shape.';prompt='Read the word aloud, then discuss its letters and sounds.'}else{let count=lv===2?3:4;let pool='abcdefghijklmnopqrstuvwxyz';let chars=Array.from({length:count},()=>pool[rand(pool.length)]);let candidate=chars.join('');let known=new Set([...defaultWords[2],...defaultWords[3],...customWords[2],...customWords[3]]);let attempts=0;while(known.has(candidate)&&attempts++<40){chars=Array.from({length:count},()=>pool[rand(pool.length)]);candidate=chars.join('')}visual=chars.join(' ');answer='Letters from left to right: '+chars.join(', ')+'.';prompt='Name the letters from left to right, in the order presented.';}}else{let count=[2,3,4,5][lv],pool=lv<2?'23456789':'23456789ABDEFGHKMPRT',a=[];while(a.length<count){let x=pool[rand(pool.length)];if(!a.includes(x))a.push(x)}visual=a.join(' ');answer='Left to right: '+a.join(', ')+'. First: '+a[0]+'. Last: '+a[a.length-1]+'.';prompt=lv<2?'Which was first? Which was last?':'Repeat the entire sequence in order.'}return {mode,lv,visual,answer,prompt}}function render(state){const s=$('stimulus');s.style.fontSize=$('fontSize').value+'px';s.style.whiteSpace='pre-line';s.textContent=state==='visible'&&trial?trial.visual:state==='fix'?'+':'';
